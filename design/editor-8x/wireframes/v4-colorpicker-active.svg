<!-- Snimach editor · variant 4 · colour picker as an active tool, with the hex chip · 1280x800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <rect x="0" y="0" width="1280" height="800" rx="10" />

  <!-- screenshot -->
  <rect x="0" y="48" width="1280" height="752" fill="#e6e6e6" stroke="none" />
  <g stroke="none" fill="#c9c9c9">
    <rect x="160" y="160" width="440" height="16" rx="4" />
    <rect x="160" y="196" width="300" height="16" rx="4" />
    <rect x="160" y="232" width="380" height="16" rx="4" />
    <rect x="680" y="160" width="380" height="16" rx="4" />
    <rect x="680" y="196" width="300" height="16" rx="4" />
    <rect x="680" y="232" width="360" height="16" rx="4" />
  </g>

  <!-- title bar -->
  <line x1="0" y1="48" x2="1280" y2="48" />
  <g fill="#fff">
    <circle cx="24" cy="24" r="6" />
    <circle cx="48" cy="24" r="6" />
    <circle cx="72" cy="24" r="6" />
  </g>
  <text x="96" y="29" font-size="14" stroke="none" fill="#000">Snimach</text>
  <g fill="none">
    <circle cx="1040" cy="24" r="16" />
    <circle cx="1080" cy="24" r="16" />
    <circle cx="1120" cy="24" r="16" />
  </g>
  <g fill="none">
    <path d="M1035 19l10 10M1045 19l-10 10" />
    <rect x="1073" y="17" width="14" height="14" rx="2" />
    <rect x="1113" y="17" width="10" height="12" rx="2" />
    <rect x="1117" y="20" width="10" height="12" rx="2" />
  </g>
  <circle cx="1196" cy="24" r="16" />
  <line x1="1185" y1="35" x2="1207" y2="13" />

  <!-- 2 · the picker while active: a hex chip near the pill -->
  <rect x="560" y="600" width="200" height="48" rx="8" />
  <circle cx="586" cy="624" r="10" fill="#000" />
  <text x="608" y="622" font-size="14" stroke="none" fill="#000">#1A1A1A</text>
  <text x="608" y="638" font-size="12" stroke="none" fill="#666">Tab to copy</text>

  <!-- secondary actions -->
  <g>
    <rect x="384" y="656" width="216" height="40" rx="8" />
    <g fill="none">
      <path d="M420 670c-6 0-10 4-10 10s4 10 10 10" />
      <polyline points="420,666 414,670 420,674" fill="none" />
      <path d="M460 670c6 0 10 4 10 10s-4 10-10 10" />
      <polyline points="460,666 466,670 460,674" fill="none" />
      <rect x="482" y="666" width="16" height="18" rx="2" />
      <line x1="480" y1="666" x2="500" y2="666" />
      <rect x="524" y="668" width="14" height="14" rx="2" />
      <rect x="530" y="662" width="14" height="14" rx="2" fill="#fff" />
    </g>
    <g fill="#000" stroke="none">
      <circle cx="572" cy="672" r="2" />
      <circle cx="572" cy="680" r="2" />
      <circle cx="572" cy="688" r="2" />
    </g>
  </g>

  <!-- 1 · tool pill; 3 · the picker tool is active -->
  <rect x="384" y="712" width="512" height="56" rx="28" />
  <g fill="none">
    <path d="M416 728l10 18 3-8 8-3z" />
    <path d="M472 730v10a8 8 0 0016 0v-8" />
    <path d="M480 730v8M488 730v8M496 732v6" />
    <path d="M524 752l14-14 4 4-14 14-6 2z" />
    <path d="M572 752l14-14 4 4-14 14-6 2z" />
    <rect x="586" y="728" width="10" height="10" rx="2" />
    <path d="M620 752l20-20M640 732v12M640 732h-12" />
    <path d="M668 730h16M676 730v20" />
    <rect x="716" y="730" width="20" height="20" rx="3" />
    <rect x="764" y="730" width="20" height="20" rx="3" />
    <g fill="#000" stroke="none">
      <rect x="768" y="734" width="5" height="5" />
      <rect x="778" y="734" width="5" height="5" />
      <rect x="773" y="741" width="5" height="5" />
    </g>
  </g>
  <!-- active tool: filled chip behind the eyedropper -->
  <rect x="800" y="716" width="48" height="48" rx="10" fill="#000" />
  <g fill="none" stroke="#fff">
    <path d="M814 752l14-14 6 6-14 14-8 2z" />
    <circle cx="828" cy="730" r="4" />
  </g>
  <line x1="860" y1="728" x2="860" y2="752" />
  <polyline points="874,738 884,728 894,738" fill="none" />

  <!-- annotation layer -->
  <g stroke="#d33" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <rect x="384" y="712" width="512" height="56" rx="28" />
    <rect x="560" y="600" width="200" height="48" rx="8" />
    <rect x="800" y="716" width="48" height="48" rx="10" />
  </g>
  <g stroke="#d33" stroke-width="1.5" fill="#d33">
    <circle cx="368" cy="740" r="12" fill="#fff" />
    <circle cx="784" cy="624" r="12" fill="#fff" />
    <circle cx="824" cy="688" r="12" fill="#fff" />
  </g>
  <g font-size="12" text-anchor="middle" stroke="none" fill="#d33">
    <text x="368" y="744">1</text>
    <text x="784" y="628">2</text>
    <text x="824" y="692">3</text>
  </g>
</svg>
