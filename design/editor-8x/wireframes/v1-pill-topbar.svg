<!-- Snimach editor · variant 1 · floating bottom pill + backdrop circle in the top bar · 1280x800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <rect x="0" y="0" width="1280" height="800" rx="10" />

  <!-- 5 · screenshot fills the window -->
  <rect x="0" y="48" width="1280" height="752" fill="#e6e6e6" stroke="none" />
  <g stroke="none" fill="#c9c9c9">
    <rect x="160" y="160" width="440" height="16" rx="4" />
    <rect x="160" y="196" width="300" height="16" rx="4" />
    <rect x="160" y="232" width="380" height="16" rx="4" />
    <rect x="160" y="268" width="220" height="16" rx="4" />
    <rect x="680" y="160" width="380" height="16" rx="4" />
    <rect x="680" y="196" width="300" height="16" rx="4" />
    <rect x="680" y="232" width="360" height="16" rx="4" />
    <rect x="680" y="268" width="180" height="16" rx="4" />
  </g>

  <!-- title bar -->
  <line x1="0" y1="48" x2="1280" y2="48" />
  <g fill="#fff">
    <circle cx="24" cy="24" r="6" />
    <circle cx="48" cy="24" r="6" />
    <circle cx="72" cy="24" r="6" />
  </g>
  <text x="96" y="29" font-size="14" stroke="none" fill="#000">Snimach</text>

  <!-- shot actions -->
  <g fill="none">
    <circle cx="1040" cy="24" r="16" />
    <circle cx="1080" cy="24" r="16" />
    <circle cx="1120" cy="24" r="16" />
  </g>
  <g stroke="none" fill="#000">
    <path d="M1034 18l12 12M1046 18l-12 12" stroke="#000" stroke-width="1.5" fill="none" />
    <rect x="1073" y="17" width="14" height="14" rx="2" fill="none" stroke="#000" stroke-width="1.5" />
    <rect x="1113" y="17" width="10" height="12" rx="2" fill="none" stroke="#000" stroke-width="1.5" />
    <rect x="1117" y="20" width="10" height="12" rx="2" fill="none" stroke="#000" stroke-width="1.5" />
  </g>

  <!-- 1 · backdrop: one circle you press -->
  <circle cx="1196" cy="24" r="16" />
  <line x1="1185" y1="35" x2="1207" y2="13" />

  <!-- 3 · secondary actions, above the pill -->
  <g>
    <rect x="384" y="648" width="216" height="40" rx="8" />
    <g fill="none">
      <path d="M420 662c-6 0-10 4-10 10s4 10 10 10" />
      <polyline points="420,658 414,662 420,666" fill="none" />
      <path d="M460 662c6 0 10 4 10 10s-4 10-10 10" />
      <polyline points="460,658 466,662 460,666" fill="none" />
      <rect x="482" y="658" width="16" height="18" rx="2" />
      <line x1="480" y1="658" x2="500" y2="658" />
      <rect x="524" y="660" width="14" height="14" rx="2" />
      <rect x="530" y="654" width="14" height="14" rx="2" fill="#fff" />
    </g>
    <g fill="#000" stroke="none">
      <circle cx="572" cy="664" r="2" />
      <circle cx="572" cy="672" r="2" />
      <circle cx="572" cy="680" r="2" />
    </g>
  </g>

  <!-- 2 · tool pill, floating over the image, centred -->
  <rect x="384" y="704" width="512" height="56" rx="28" />
  <g fill="none">
    <!-- select -->
    <path d="M416 720l10 18 3-8 8-3z" />
    <!-- hand -->
    <path d="M472 722v10a8 8 0 0016 0v-8" />
    <path d="M480 722v8M488 722v8M496 724v6" />
    <!-- pencil -->
    <path d="M524 744l14-14 4 4-14 14-6 2z" />
    <!-- marker -->
    <path d="M572 744l14-14 4 4-14 14-6 2z" />
    <rect x="586" y="720" width="10" height="10" rx="2" />
    <!-- arrow -->
    <path d="M620 744l20-20M640 724v12M640 724h-12" />
    <!-- text -->
    <path d="M668 722h16M676 722v20" />
    <!-- rectangle -->
    <rect x="716" y="722" width="20" height="20" rx="3" />
    <!-- redact -->
    <rect x="764" y="722" width="20" height="20" rx="3" />
    <g fill="#000" stroke="none">
      <rect x="768" y="726" width="5" height="5" />
      <rect x="778" y="726" width="5" height="5" />
      <rect x="773" y="733" width="5" height="5" />
    </g>
    <!-- 4 · eyedropper: the colour picker, a tool you activate -->
    <path d="M814 744l14-14 6 6-14 14-8 2z" />
    <circle cx="828" cy="722" r="4" />
  </g>
  <line x1="852" y1="720" x2="852" y2="744" />
  <!-- chevron: expand -->
  <polyline points="866,730 876,720 886,730" fill="none" />

  <!-- annotation layer: red dashed, not part of the UI -->
  <g stroke="#d33" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <circle cx="1196" cy="24" r="26" />
    <rect x="384" y="704" width="512" height="56" rx="28" />
    <rect x="384" y="648" width="216" height="40" rx="8" />
    <rect x="644" y="96" width="560" height="480" rx="8" />
  </g>
  <g stroke="#d33" stroke-width="1.5" fill="#d33">
    <circle cx="1180" cy="64" r="12" fill="#fff" />
    <circle cx="368" cy="732" r="12" fill="#fff" />
    <circle cx="368" cy="668" r="12" fill="#fff" />
    <circle cx="828" cy="700" r="12" fill="#fff" />
    <circle cx="1220" cy="104" r="12" fill="#fff" />
  </g>
  <g font-size="12" text-anchor="middle" stroke="none" fill="#d33">
    <text x="1180" y="68">1</text>
    <text x="368" y="736">2</text>
    <text x="368" y="672">3</text>
    <text x="828" y="704">4</text>
    <text x="1220" y="108">5</text>
  </g>
</svg>
