<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snimach backdrop gallery</title>
<style>
  :root {
    --bg: #0c0c0d;
    --ink: #ececee;
    --muted: #9a9aa0;
    --sep: rgba(255, 255, 255, 0.14);
    --accent: #e8502a;
    --sans: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; padding: 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; max-width: 900px; }
  #shortbar {
    position: sticky;
    top: 12px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,20,22,.94);
    border: 1px solid #4a4a50;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    margin-bottom: 20px;
    max-width: 1180px;
  }
  #shortbar .counts { font-family: var(--mono); font-weight: 700; }
  #shortbar .picks { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  #shortbar button {
    margin-left: auto;
    font: inherit;
    color: var(--icon);
    background: rgba(255,255,255,.1);
    border: 1px solid var(--sep);
    border-radius: 8px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .kgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 1180px; }
  .kcell { border-radius: 12px; padding: 18px; cursor: pointer; border: 2px solid transparent; position: relative; }
  .kcell:hover { border-color: rgba(255,255,255,.45); }
  .kcell.picked { border-color: var(--accent); }
  .kcell .knum {
    position: absolute;
    top: 8px;
    left: 10px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,.55);
    border-radius: 6px;
    padding: 1px 7px;
  }
  .kcell .knum.picked { background: var(--accent); }
  .kcell .kname {
    margin-top: 10px;
    font-size: 12px;
    color: #fff;
    background: rgba(0,0,0,.55);
    border-radius: 6px;
    padding: 2px 8px;
    display: inline-block;
  }
  .kcell .ksrc { display: block; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.75); }
  .kshot { border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .kshot canvas { display: block; width: 100%; }
  .kcompare { display: flex; gap: 8px; align-items: stretch; }
  .kcompare img, .kcompare .kshot { flex: 1; min-width: 0; }
  .kcompare img { border-radius: 8px; width: 100%; display: block; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid #4a4a50;
    border-radius: 10px;
    padding: 8px 18px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 150ms;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>
</head>
<body>
<h1>Snimach backdrop gallery</h1>

  function paint(cv) {
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    g.fillStyle = '#1e1e24';
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#26262d';
    g.fillRect(0, 0, W, 34);
    ['#ff5f57', '#8e8e93', '#28c840'].forEach((c, i) => {
      g.fillStyle = c;
      g.beginPath();
      g.arc(20 + i * 20, 17, 6, 0, 7);
      g.fill();
    });
    g.fillStyle = '#17171b';
    g.fillRect(0, 34, 150, H - 34);
    const lines = ['#c792ea', '#82aaff', '#7fdbca', '#f07178', '#ffcb6b', '#8e8e93'];
    for (let r = 0; r < 12; r++) {
      let x = 170;
      const y = 58 + r * 20;
      for (let s = 0; s < 4; s++) {
        const w = 40 + ((r * 37 + s * 53) % 120);
        g.fillStyle = lines[(r + s) % lines.length];
        g.globalAlpha = 0.85;
        g.fillRect(x, y, w, 9);
        x += w + 14;
        if (x > W - 60) break;
      }
    }
    g.globalAlpha = 1;
    const ax0 = W * 0.3, ay0 = H * 0.62, ax1 = W * 0.62, ay1 = H * 0.34;
    const ang = Math.atan2(ay1 - ay0, ax1 - ax0);
    const headLen = 26, headHalf = Math.PI / 7;
    const bx = ax1 - headLen * 0.9 * Math.cos(ang), by = ay1 - headLen * 0.9 * Math.sin(ang);
    g.strokeStyle = '#e8502a';
    g.lineWidth = 8;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(ax0, ay0);
    g.lineTo(bx, by);
    g.stroke();
    g.fillStyle = '#e8502a';
    g.beginPath();
    g.moveTo(ax1, ay1);
    g.lineTo(ax1 - headLen * Math.cos(ang - headHalf), ay1 - headLen * Math.sin(ang - headHalf));
    g.lineTo(ax1 - headLen * Math.cos(ang + headHalf), ay1 - headLen * Math.sin(ang + headHalf));
    g.closePath();
    g.fill();
  }
  const toast = document.getElementById('toast');
  let toastT = 0;
  function flash(msg) {
    toast.textContent = msg;
    toast.style.opacity = 1;
    clearTimeout(toastT);
    toastT = setTimeout(() => toast.style.opacity = 0, 1600);
  }
  const shortlist = [];
  function renderShort() {
    document.querySelector('[data-short-count]').textContent = 'Shortlist ' + shortlist.length + '/10';
    document.querySelector('[data-short-picks]').textContent = shortlist.length ? shortlist.join('  ') : 'click a card to shortlist';
  }
  document.querySelector('[data-short-copy]').addEventListener('click', () => {
    try { navigator.clipboard.writeText(shortlist.join(', ')); } catch (_) {}
    flash(shortlist.length ? 'Copied ' + shortlist.join(', ') : 'Nothing shortlisted yet');
  });
  const grid = document.querySelector('[data-grid]');
  ITEMS.forEach((item, i) => {
    const id = '#' + (i + 1);
    const cell = document.createElement('div');
    cell.className = 'kcell';
    cell.style.background = item.css;
    const photo = item.kind === 'palette' ? '<img src="' + PHOTOS[item.name] + '" alt="' + item.name + ' source photo">' : '';
    const shot = '<div class="kshot"><canvas width="240" height="200"></canvas></div>';
    const src = item.src ? '<span class="ksrc">' + item.src + '</span>' : '';
    cell.innerHTML = '<span class="knum">' + id + '</span><div class="kcompare">' + photo + shot + '</div><div class="kname">' + id + ' ' + item.name + '</div>' + src;
    paint(cell.querySelector('canvas'));
    cell.addEventListener('click', () => {
      const at = shortlist.indexOf(id);
      if (at >= 0) shortlist.splice(at, 1);
      else shortlist.push(id);
      cell.classList.toggle('picked', at < 0);
      cell.querySelector('.knum').classList.toggle('picked', at < 0);
      renderShort();
    });
    grid.appendChild(cell);
  });
