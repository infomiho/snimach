<!-- Snimach editor default · 1280x800 desktop · one compact accessory bar -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <rect width="1280" height="800" rx="10"/>
  <rect y="48" width="1280" height="752" fill="#e6e6e6" stroke="none"/>
  <g fill="#c9c9c9" stroke="none">
    <rect x="160" y="160" width="440" height="16" rx="4"/><rect x="160" y="196" width="300" height="16" rx="4"/><rect x="160" y="232" width="380" height="16" rx="4"/>
    <rect x="680" y="160" width="380" height="16" rx="4"/><rect x="680" y="196" width="300" height="16" rx="4"/><rect x="680" y="232" width="360" height="16" rx="4"/>
  </g>

  <!-- native title bar -->
  <line x1="0" y1="48" x2="1280" y2="48"/>
  <g fill="#fff"><circle cx="24" cy="24" r="6"/><circle cx="48" cy="24" r="6"/><circle cx="72" cy="24" r="6"/></g>
  <text x="96" y="29" font-size="14" stroke="none" fill="#000">Snimach</text>
  <g fill="none">
    <circle cx="1120" cy="24" r="16"/><circle cx="1160" cy="24" r="16"/><circle cx="1200" cy="24" r="16"/>
    <path d="M1115 19l10 10M1125 19l-10 10"/><rect x="1153" y="17" width="14" height="14" rx="2"/><rect x="1193" y="17" width="10" height="12" rx="2"/><rect x="1197" y="20" width="10" height="12" rx="2"/>
  </g>

  <!-- one compact accessory bar, grouped by task -->
  <rect x="400" y="704" width="480" height="56" rx="28"/>
  <!-- annotation tools: four real tools only -->
  <rect x="408" y="712" width="160" height="40" rx="20" fill="#000"/>
  <g fill="none" stroke="#fff">
    <path d="M428 720l18 18 2-9 9-3z"/>
    <path d="M476 722l14 14M490 722l-14 14"/>
    <rect x="516" y="720" width="20" height="20" rx="3"/>
    <rect x="548" y="720" width="20" height="20" rx="3"/>
    <g fill="#fff" stroke="none"><rect x="552" y="724" width="5" height="5"/><rect x="562" y="724" width="5" height="5"/><rect x="557" y="731" width="5" height="5"/></g>
  </g>
  <line x1="584" y1="716" x2="584" y2="748"/>
  <!-- undo and redo -->
  <g fill="none">
    <path d="M604 728c0-7 5-12 12-12h10M604 728l7-7M604 728l7 7"/>
    <path d="M656 728c0-7-5-12-12-12h-10M656 728l-7-7M656 728l-7 7"/>
  </g>
  <line x1="680" y1="716" x2="680" y2="748"/>
  <!-- one backdrop toggle, swatch plus label -->
  <circle cx="704" cy="732" r="14"/>
  <line x1="694" y1="742" x2="714" y2="722"/>
  <text x="728" y="737" font-size="13" stroke="none" fill="#000">Backdrop</text>
  <line x1="800" y1="716" x2="800" y2="748"/>
  <!-- color picker tool, inactive -->
  <path d="M824 744l14-14 6 6-14 14-8 2z" fill="none"/>
  <circle cx="838" cy="722" r="4" fill="none"/>

  <!-- callouts, red annotation layer only -->
  <g stroke="#d33" stroke-dasharray="4 4" fill="none">
    <rect x="400" y="704" width="480" height="56" rx="28"/>
    <rect x="408" y="712" width="160" height="40" rx="20"/>
    <circle cx="704" cy="732" r="24"/>
  </g>
  <g stroke="#d33" fill="#fff"><circle cx="384" cy="732" r="12"/><circle cx="384" cy="716" r="12"/><circle cx="736" cy="688" r="12"/></g>
  <g font-size="12" text-anchor="middle" stroke="none" fill="#d33"><text x="384" y="736">1</text><text x="384" y="720">2</text><text x="736" y="692">3</text></g>
</svg>
